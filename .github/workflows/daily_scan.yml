name: Daily Tender Scan

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 08:00 Uganda (UTC+3)
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml

    - name: Run Scraper Engine
      env:
        GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        SEND_REPORT_EMAIL: ${{ vars.SEND_REPORT_EMAIL }}
      run: python scraper.py

    - name: Put the report into the inbox
      # The report is sent from info@ to an address on the same mailbox, and Gmail
      # then files it under Sent only. Add the INBOX label so it is actually seen.
      if: always()
      continue-on-error: true
      env:
        GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
      run: |
        pip install --quiet google-api-python-client google-auth
        python - <<'PY'
        import json, os
        from google.oauth2.credentials import Credentials
        from googleapiclient.discovery import build
        info = json.loads(os.environ["GMAIL_TOKEN_JSON"])
        creds = Credentials.from_authorized_user_info(info, ["https://mail.google.com/"])
        g = build("gmail", "v1", credentials=creds)
        r = g.users().messages().list(userId="me", q='in:sent subject:"Sarmad Monitor" newer_than:1d -in:inbox').execute()
        for m in r.get("messages", []):
            g.users().messages().modify(userId="me", id=m["id"], body={"addLabelIds": ["INBOX", "UNREAD"]}).execute()
            print("moved to inbox:", m["id"])
        print("done,", len(r.get("messages", [])), "message(s)")
        PY

    - name: Commit and push changes
      run: |
        git config --global user.name "Automated Scraper"
        git config --global user.email "actions@github.com"
        git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}
        for i in 1 2 3; do
          git fetch origin
          mkdir -p /tmp/sites_backup
          cp -r sites/. /tmp/sites_backup/
          git reset --hard origin/main
          cp -r /tmp/sites_backup/. sites/
          git add sites/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            break
          fi
          git commit -m "Update daily tender snapshots" && git push && break
          echo "Push failed (attempt $i), retrying in 10s..."
          sleep 10
        done
