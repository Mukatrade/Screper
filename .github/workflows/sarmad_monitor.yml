name: Sarmad Monitor

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 08:00 Israel/Uganda, same daily summary as PythonAnywhere
  workflow_dispatch:

concurrency:
  group: sarmad-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml google-api-python-client google-auth

      - name: Run Sarmad Monitor
        env:
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python sarmad_monitor.py

      - name: Put the emails into the inbox
        # Mail sent from info@ to the same mailbox is filed under Sent only. Add INBOX so it is seen.
        if: always()
        continue-on-error: true
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          pip install --quiet google-api-python-client google-auth
          python - <<'PY'
          import json, os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          info = json.loads(os.environ["GMAIL_TOKEN_JSON"])
          creds = Credentials.from_authorized_user_info(info, ["https://mail.google.com/"])
          g = build("gmail", "v1", credentials=creds)
          q = 'in:sent (subject:"Sarmad Monitor" OR subject:"Changes Detected on" OR subject:"Error Detected") newer_than:1d -in:inbox'
          r = g.users().messages().list(userId="me", q=q).execute()
          for m in r.get("messages", []):
              g.users().messages().modify(userId="me", id=m["id"], body={"addLabelIds": ["INBOX", "UNREAD"]}).execute()
              print("moved to inbox:", m["id"])
          print("done,", len(r.get("messages", [])), "message(s)")
          PY

      - name: Commit snapshots
        if: always()
        run: |
          git config --global user.name "Automated Scraper"
          git config --global user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}
          for i in 1 2 3; do
            git fetch origin
            mkdir -p /tmp/sarmad_backup
            cp -r sarmad_state/. /tmp/sarmad_backup/ 2>/dev/null || true
            git reset --hard origin/main
            mkdir -p sarmad_state
            cp -r /tmp/sarmad_backup/. sarmad_state/ 2>/dev/null || true
            git add sarmad_state/ || true
            if git diff --cached --quiet; then
              echo "No changes to commit."
              break
            fi
            git commit -m "Update Sarmad Monitor snapshots" && git push && break
            echo "Push failed (attempt $i), retrying in 10s..."
            sleep 10
          done
